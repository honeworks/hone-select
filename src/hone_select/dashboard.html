<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hone-select</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --text: #0f172a; --muted: #64748b;
    --border: #e4e7ec; --accent: #4f46e5; --accent-soft: #eef0ff; --accent-text: #ffffff;
    --ok: #15803d; --ok-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7; --bad: #b91c1c; --bad-soft: #fee2e2;
    --info: #0369a1; --info-soft: #e0f2fe; --bar: #c7cbf9; --bar-win: #4f46e5;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.07);
    --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12; --surface: #12151c; --surface-2: #191d27; --text: #e6e8ee; --muted: #8b95a7;
      --border: #242a36; --accent: #8b93ff; --accent-soft: #1d2140; --accent-text: #0b0d12;
      --ok: #4ade80; --ok-soft: #10281a; --warn: #fbbf24; --warn-soft: #2b2210; --bad: #f87171; --bad-soft: #2c1414;
      --info: #38bdf8; --info-soft: #0c2230; --bar: #33397a; --bar-win: #8b93ff; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; cursor: pointer; }
  code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
  .app { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; }
  aside { background: var(--surface); border-right: 1px solid var(--border); padding: 18px 14px; position: sticky; top: 0; height: 100vh;
          display: flex; flex-direction: column; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; padding: 4px 8px 16px; white-space: nowrap; }
  .brand .dot { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), #a855f7); }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; }
  .nav a:hover { background: var(--surface-2); color: var(--text); }
  .nav a.active { background: var(--accent-soft); color: var(--accent); }
  .nav svg { width: 17px; height: 17px; flex: none; }
  .source { margin-top: auto; font-size: 11.5px; color: var(--muted); padding: 8px; border-top: 1px solid var(--border); word-break: break-all; }
  main { padding: 28px 36px 80px; max-width: 1400px; width: 100%; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .head h1 { font-size: 22px; line-height: 1.25; margin: 2px 0 4px; font-weight: 700; letter-spacing: -.01em; }
  .head p { margin: 0; color: var(--muted); max-width: 820px; }
  .crumbs { font-size: 12.5px; color: var(--muted); }
  .crumbs a { color: var(--muted); } .crumbs a:hover { color: var(--accent); }
  h2 { font-size: 15px; margin: 26px 0 10px; font-weight: 650; }
  .muted { color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .tile .label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .tile .value { font-size: 20px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
  .tile .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
          background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.info { background: var(--info-soft); color: var(--info); }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); font-size: 12px; margin: 1px 4px 1px 0; }
  .chip b { font-weight: 600; }
  .btn { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
         color: var(--text); cursor: pointer; display: inline-block; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--bad); }
  .btn.small { padding: 3px 10px; font-size: 12.5px; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
                            border-radius: 8px; padding: 7px 10px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .progress { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .callout { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap;
             border-left: 3px solid var(--accent); margin-bottom: 4px; }
  .callout.bad { border-left-color: var(--bad); } .callout.ok { border-left-color: var(--ok); } .callout.warn { border-left-color: var(--warn); }
  .cmd { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 8px; padding: 4px 5px 4px 10px; max-width: 100%; }
  .cmd code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .toolbar input[type=search] { width: 280px; }
  .tablewrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; max-height: 70vh; box-shadow: var(--shadow); }
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  th, td { padding: 9px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { position: sticky; top: 0; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer;
       user-select: none; z-index: 1; }
  th:hover { color: var(--text); }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th .arrow { opacity: .7; margin-left: 3px; }
  tr.filters th { top: 37px; cursor: default; padding-top: 0; }
  tr.filters input { width: 100%; min-width: 70px; padding: 4px 8px; font-size: 12px; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover td { background: var(--surface-2); }
  tbody tr.win td { background: var(--accent-soft); }
  td .trunc { display: inline-block; max-width: 340px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
  .empty { padding: 36px; text-align: center; color: var(--muted); }
  .scorebar { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .scorebar .track { position: relative; width: 90px; height: 7px; background: var(--surface-2); border-radius: 99px; }
  .scorebar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 99px; }
  .scorebar .fill.win { background: var(--bar-win); }
  .scorebar .ci { position: absolute; top: -3px; bottom: -3px; border-left: 2px solid var(--text); border-right: 2px solid var(--text); opacity: .35; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 22px 0 18px; overflow-x: auto; }
  .tabs a { padding: 9px 14px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs a.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs .count { font-size: 11px; background: var(--surface-2); border-radius: 99px; padding: 0 7px; margin-left: 5px; color: var(--muted); }
  pre { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; overflow: auto; max-height: 420px; white-space: pre-wrap;
        word-break: break-word; margin: 6px 0 0; }
  details > summary { cursor: pointer; font-weight: 600; margin: 8px 0; }
  .exp-card { display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: border-color .15s, transform .15s; }
  .exp-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .exp-card .q { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 42px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .answer { border-color: var(--accent); background: linear-gradient(0deg, var(--surface), var(--accent-soft)); margin-top: 14px; }
  .answer .big { font-size: 18px; font-weight: 700; margin: 4px 0 8px; }
  .chart .lvl { display: grid; grid-template-columns: 150px 1fr 60px; gap: 10px; align-items: center; margin: 7px 0; font-size: 13px; }
  .chart .lvl .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart .lvl .num { text-align: right; font-variant-numeric: tabular-nums; }
  .chart .bar { position: relative; height: 14px; background: var(--surface-2); border-radius: 4px; }
  .chart .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 4px; }
  .chart .bar .fill.win { background: var(--bar-win); }
  .chart .bar .ci { position: absolute; top: 3px; bottom: 3px; border-left: 2px solid var(--text); border-right: 2px solid var(--text); opacity: .45; }
  .chart .bar .ci::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid var(--text); }
  .drawer-bg { position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 20; display: none; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--surface); z-index: 21;
            border-left: 1px solid var(--border); box-shadow: -8px 0 30px rgba(0,0,0,.15); transform: translateX(100%);
            transition: transform .2s ease, visibility .2s; display: flex; flex-direction: column; visibility: hidden; }
  .drawer.open { transform: none; visibility: visible; } .drawer-bg.open { display: block; }
  .drawer header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .drawer header h3 { margin: 0; font-size: 15px; word-break: break-all; }
  .drawer .body { padding: 6px 20px 30px; overflow: auto; }
  .media img, .media video { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-top: 6px; }
  .media audio { width: 100%; margin-top: 6px; }
  .media { margin: 10px 0; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 13px; align-items: center; }
  .kv > :nth-child(odd) { color: var(--muted); }
  .kv .scorebar { justify-content: flex-start; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px;
           border-radius: 8px; font-weight: 600; z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .rate { max-width: 760px; margin: 0 auto; }
  .scale { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 18px 0 6px; }
  .scale .btn { min-width: 56px; padding: 12px 0; font-size: 16px; }
  .kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
  ol.steps { margin: 8px 0 0 18px; padding: 0; line-height: 2.1; }
  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    aside { position: static; height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding: 10px 12px; }
    .brand { padding: 0 8px 0 0; } .nav { display: flex; gap: 2px; } .source { display: none; }
    main { padding: 20px 16px 60px; }
    .toolbar input[type=search] { width: 100%; }
    .chart .lvl { grid-template-columns: 100px 1fr 50px; }
    .cards { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="dot"></span>hone-select</div>
    <nav class="nav">
      <a data-nav="experiments" href="#/experiments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/></svg>Experiments</a>
      <a data-nav="runs" href="#/runs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Runs</a>
      <a data-nav="candidates" href="#/candidates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Candidates</a>
    </nav>
    <div class="source" id="source"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="drawer-bg" id="drawer-bg"></div>
<div class="drawer" id="drawer" aria-hidden="true"><header><h3 id="drawer-title"></h3><button class="btn small" id="drawer-close">Close <span class="kbd">Esc</span></button></header><div class="body" id="drawer-body"></div></div>
<div class="toast" id="toast"></div>
<script>
// ---- helpers ---------------------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const main = $("main");
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = v => typeof v === "number" ? (Object.is(v, -0) || Math.abs(v) < 5e-4 ? "0" : Number.isInteger(v) ? v.toLocaleString() : v.toFixed(3)) : (v ?? "—");
const signed = v => typeof v === "number" ? (fmt(v) === "0" ? "0" : v > 0 ? `+${fmt(v)}` : fmt(v)) : "—";
const flat = v => v === null || v === undefined ? "" : typeof v === "object" ? JSON.stringify(v) : String(v);
const when = s => s ? new Date(s).toLocaleString([], {dateStyle: "medium", timeStyle: "short"}) : "";
const secs = (a, b) => a && b ? (new Date(b) - new Date(a)) / 1000 : null;
const duration = s => s === null || s === undefined ? "—" : s < 60 ? `${s.toFixed(1)} s` : s < 3600 ? `${(s / 60).toFixed(1)} min` : `${(s / 3600).toFixed(1)} h`;
const pct = v => typeof v === "number" ? `${Math.round(v * 100)}%` : "—";
let refresh = null;
async function get(path) {
  const r = await fetch(path);
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}
async function send(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Hone-Dashboard": "1"}, body: JSON.stringify(body)});
  const out = await r.json();
  if (!r.ok) throw new Error(out.error || r.statusText);
  return out;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); }
function copy(text) { navigator.clipboard?.writeText(text).then(() => toast("Copied"), () => toast(text)); }
const cmd = text => `<span class="cmd"><code title="${esc(text)}">${esc(text)}</code><button class="btn small" data-copy="${esc(text)}">Copy</button></span>`;
document.addEventListener("click", e => { const b = e.target.closest("[data-copy]"); if (b) { e.stopPropagation(); copy(b.dataset.copy); } });

const STATUS = {completed: "ok", approved: "info", running: "accent", proposed: "warn", denied: "bad", stopped: "bad", draft: "", ok: "ok", error: "bad", unset: ""};
const pill = s => `<span class="pill ${STATUS[s] ?? ""}">${esc(s)}</span>`;
const chips = obj => Object.entries(obj || {}).map(([k, v]) => `<span class="chip">${esc(k)} <b>${esc(flat(v))}</b></span>`).join("");
const ctxChips = r => Object.entries(r.context || {}).map(([k, v]) => `<span class="chip">${esc(k.replace("hone.", ""))} <b>${esc(v)}</b></span>`).join("");
const tile = (label, value, sub = "") => `<div class="card tile"><div class="label">${esc(label)}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
const progress = (done, total) => `<div class="progress"><div style="width:${total ? Math.min(100, 100 * done / total) : 0}%"></div></div>`;
function head(title, sub = "", crumbs = "", actions = "") {
  return `<div class="head"><div>${crumbs ? `<div class="crumbs">${crumbs}</div>` : ""}<h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div><div>${actions}</div></div>`;
}
function scorebar(v, {low = null, high = null, win = false, max = 1} = {}) {
  if (typeof v !== "number") return `<span class="muted">—</span>`;
  const w = x => `${Math.max(0, Math.min(100, 100 * x / max))}%`;
  const ci = typeof low === "number" && typeof high === "number" ? `<div class="ci" style="left:${w(low)};width:calc(${w(high)} - ${w(low)})"></div>` : "";
  return `<div class="scorebar"><span>${fmt(v)}</span><div class="track"><div class="fill ${win ? "win" : ""}" style="width:${w(v)}"></div>${ci}</div></div>`;
}
function openDrawer(title, html) {
  $("drawer-title").textContent = title; $("drawer-body").innerHTML = html;
  $("drawer").classList.add("open"); $("drawer-bg").classList.add("open"); $("drawer").setAttribute("aria-hidden", "false");
}
function closeDrawer() { $("drawer").classList.remove("open"); $("drawer-bg").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true"); }
$("drawer-close").onclick = closeDrawer; $("drawer-bg").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

// A table: columns [{key, label, get(row), html(row), num, title}], one search box, optional per-column
// filters, sortable headers, click on a row. opts: {onRow, empty, rowClass, maxHeight}.
function table(el, columns, rows, opts = {}) {
  const st = {sort: null, dir: -1, filters: {}, showFilters: false};
  const val = (c, r) => c.get ? c.get(r) : r[c.key];
  el.innerHTML = `<div class="toolbar"><input type="search" placeholder="Search…" aria-label="Search the table"><button class="btn small" data-f>Filters</button>
    <span class="muted count"></span></div><div class="tablewrap"${opts.maxHeight ? ` style="max-height:${opts.maxHeight}"` : ""}><table><thead></thead><tbody></tbody></table></div>`;
  const [search, fbtn, count] = [el.querySelector("input"), el.querySelector("[data-f]"), el.querySelector(".count")];
  const thead = el.querySelector("thead"), tbody = el.querySelector("tbody");
  function drawHead() {
    thead.innerHTML = `<tr>${columns.map((c, i) => `<th data-i="${i}" class="${c.num ? "num" : ""}" title="${esc(c.title || "Sort")}">${esc(c.label)}${st.sort === i ? `<span class="arrow">${st.dir > 0 ? "▲" : "▼"}</span>` : ""}</th>`).join("")}</tr>` +
      (st.showFilters ? `<tr class="filters">${columns.map((c, i) => `<th><input data-i="${i}" value="${esc(st.filters[i] || "")}" placeholder="filter" aria-label="Filter ${esc(c.label)}"></th>`).join("")}</tr>` : "");
    thead.querySelectorAll("tr:first-child th").forEach(th => th.onclick = () => {
      const i = Number(th.dataset.i); st.dir = st.sort === i ? -st.dir : -1; st.sort = i; drawHead(); drawBody();
    });
    thead.querySelectorAll("tr.filters input").forEach(inp => inp.oninput = () => { st.filters[inp.dataset.i] = inp.value.toLowerCase(); drawBody(); });
  }
  function drawBody() {
    const words = search.value.toLowerCase().split(/\s+/).filter(Boolean);
    let shown = rows.filter(r => {
      const cells = columns.map(c => flat(val(c, r)).toLowerCase());
      return words.every(w => cells.some(t => t.includes(w))) && Object.entries(st.filters).every(([i, f]) => !f || cells[i].includes(f));
    });
    if (st.sort !== null) {
      const c = columns[st.sort];
      shown = [...shown].sort((a, b) => {
        const [x, y] = [val(c, a), val(c, b)];
        if (x === y) return 0; if (x === null || x === undefined || x === "") return 1; if (y === null || y === undefined || y === "") return -1;
        return (typeof x === "number" && typeof y === "number" ? x - y : flat(x).localeCompare(flat(y), undefined, {numeric: true})) * st.dir;
      });
    }
    count.textContent = shown.length === rows.length ? `${rows.length} ${rows.length === 1 ? "row" : "rows"}` : `${shown.length} of ${rows.length}`;
    el.dispatchEvent(new CustomEvent("shown", {detail: shown}));
    if (!shown.length) { tbody.innerHTML = `<tr><td colspan="${columns.length}" class="empty">${esc(rows.length ? "Nothing matches the search or filters." : opts.empty || "Nothing here yet.")}</td></tr>`; return; }
    tbody.innerHTML = "";
    for (const r of shown) {
      const tr = document.createElement("tr");
      if (opts.onRow) tr.className = "click";
      const extra = opts.rowClass ? opts.rowClass(r) : "";
      if (extra) tr.classList.add(extra);
      tr.innerHTML = columns.map(c => {
        const v = val(c, r);
        const inner = c.html ? c.html(r) : c.num ? esc(fmt(v)) : `<span class="trunc" title="${esc(flat(v))}">${esc(flat(v))}</span>`;
        return `<td class="${c.num ? "num" : ""}">${inner}</td>`;
      }).join("");
      if (opts.onRow) tr.onclick = () => opts.onRow(r);
      tbody.appendChild(tr);
    }
  }
  search.oninput = drawBody;
  fbtn.onclick = () => { st.showFilters = !st.showFilters; fbtn.classList.toggle("primary", st.showFilters); drawHead(); };
  drawHead(); drawBody();
}

const fileView = (eid, base, name) => {
  const url = `/files/${encodeURIComponent(eid)}/${base}/${name.split("/").map(encodeURIComponent).join("/")}`;
  if (/\.(png|jpe?g|gif|webp|svg)$/i.test(name)) return `<div class="media"><div class="muted">${esc(name)}</div><img src="${url}" alt="${esc(name)}"></div>`;
  if (/\.(wav|mp3|ogg|flac|m4a)$/i.test(name)) return `<div class="media"><div class="muted">${esc(name)}</div><audio controls src="${url}"></audio></div>`;
  if (/\.(mp4|webm|mov)$/i.test(name)) return `<div class="media"><div class="muted">${esc(name)}</div><video controls src="${url}"></video></div>`;
  return `<div class="media"><a href="${url}" target="_blank">${esc(name)}</a></div>`;
};
const outputView = v => v === null || v === undefined ? "" : `<pre>${esc(typeof v === "object" ? JSON.stringify(v, null, 2) : String(v))}</pre>`;

async function showCandidates() {
  const rows = await get("/api/candidates");
  const params = [...new Set(rows.flatMap(c => Object.keys(c.params)))];
  const scorers = [...new Set(rows.flatMap(c => Object.keys(c.scores)))];
  main.innerHTML = head("Candidates", "Every candidate of every run. Compare by a setting that was varied (a model, a temperature) to see which value wins.") +
    `<div class="card"><div class="row"><div><b>Compare by</b> <select id="g" aria-label="Compare by"><option value="">choose a setting</option>${params.map(p => `<option>${esc(p)}</option>`).join("")}</select></div>
      <span class="muted">over the candidates the table below keeps</span></div><div id="s" style="margin-top:12px"></div></div>
    <h2>All candidates</h2><div id="t"></div>`;
  let kept = rows;
  const group = () => {
    const key = $("g").value, out = $("s");
    if (!key) { out.innerHTML = `<div class="muted">${params.length ? "Pick a setting to compare its values." : "No varied settings recorded yet."}</div>`; return; }
    const by = {};
    for (const c of kept) {
      const g = by[flat(c.params[key])] ??= {value: flat(c.params[key]), candidates: 0, wins: 0, totals: []};
      g.candidates++; if (c.winner) g.wins++; if (typeof c.total === "number") g.totals.push(c.total);
    }
    const levels = Object.values(by).map(g => ({...g, win_rate: g.wins / g.candidates, mean: g.totals.length ? g.totals.reduce((a, b) => a + b, 0) / g.totals.length : null}))
      .sort((a, b) => b.win_rate - a.win_rate);
    if (!levels.length) { out.innerHTML = `<div class="muted">No candidates match.</div>`; return; }
    out.innerHTML = `<div class="chart">${levels.map((l, i) => `<div class="lvl"><div class="name" title="${esc(l.value)}"><b>${esc(l.value || "(not set)")}</b></div>
      <div class="bar"><div class="fill ${i === 0 ? "win" : ""}" style="width:${100 * l.win_rate}%"></div></div><div class="num">${pct(l.win_rate)}</div></div>`).join("")}</div>
      <div class="muted" style="margin-top:6px;font-size:12.5px">Win rate per value · ${levels.map(l => `${esc(l.value || "(not set)")}: ${l.wins} of ${l.candidates}, mean total ${fmt(l.mean)}`).join(" · ")}</div>`;
  };
  $("g").onchange = group;
  const t = $("t");
  t.addEventListener("shown", e => { kept = e.detail; group(); });
  table(t, [
    {label: "Run started", get: c => c.start, html: c => esc(when(c.start))},
    {key: "run_id", label: "Run", html: c => `<span class="mono">${esc(c.run_id)}</span>`},
    {label: "Where", get: c => flat(c.context), html: c => ctxChips(c)},
    {key: "id", label: "Candidate", html: c => `<span class="mono">${esc(c.id)}</span>`},
    ...params.map(p => ({label: p, get: c => c.params[p]})),
    ...scorers.map(s => ({label: s, num: true, get: c => c.scores[s] ?? null, html: c => scorebar(c.scores[s] ?? null)})),
    {key: "total", label: "Total", num: true, html: c => scorebar(c.total, {win: c.winner})},
    {key: "rank", label: "#", num: true},
  ], rows, {onRow: c => { location.hash = `#/run/${c.run_id}`; }, rowClass: c => c.winner ? "win" : "", empty: "No candidates recorded yet."});
}

const howItWorks = `<div class="card"><b>How experiments work</b><ol class="steps muted">

async function showExperiments() {

function expCard(x) {
  const next = {draft: "Needs a plan", proposed: `<b style="color:var(--warn)">Waiting for your decision</b>`, approved: "Ready to start",
    running: "Running…", stopped: "Stopped — start resumes", denied: `Denied${x.review?.note ? `: ${esc(x.review.note)}` : ""}`, completed: "Results ready"}[x.status] || "";
  return `<div class="card exp-card" data-eid="${esc(x.eid)}" tabindex="0"><div class="row"><span class="muted mono">${esc(x.eid)}</span>${pill(x.status)}</div>
    <div style="font-weight:650;font-size:15px">${esc(x.title)}</div><div class="q">${esc(x.question) || "<i>No question written yet.</i>"}</div>
    ${progress(x.done, x.outputs)}<div class="row muted" style="font-size:12.5px"><span>${fmt(x.done)} / ${fmt(x.outputs ?? "?")} outputs</span><span>${next}</span></div></div>`;
}

function decisionCard(x) {
  const p = x.plan, e = p.estimate;
  return `<div class="card callout warn"><div style="flex:1;min-width:280px">
      <b>This plan needs your decision.</b><div class="muted" style="margin-top:4px">It produces <b>${fmt(p.outputs)}</b> outputs (${p.cases.length} cases × ${Object.keys(p.setups).length} setups × ${p.samples} ${p.samples === 1 ? "sample" : "samples"})
      and ${fmt(p.judge_calls)} judge calls. Estimate: ${e.seconds === null ? "time unknown" : duration(e.seconds)}, ${e.money_usd === null ? "cost unknown" : "$" + fmt(e.money_usd)}.
      See exactly what runs in the <a href="#/experiment/${esc(x.eid)}/plan">Plan</a> tab.</div>
      <textarea id="note" rows="2" style="width:100%;margin-top:10px" placeholder="Note (required to deny)" aria-label="Note"></textarea></div>
    <div style="display:flex;gap:8px"><button class="btn primary" id="approve">Approve</button><button class="btn danger" id="deny">Deny</button></div></div>`;
}
function nextStep(x) {
  if (x.status === "proposed" && x.plan) return decisionCard(x);
  if (x.changed_since_plan) return `<div class="card callout bad"><div><b>The definition changed since the plan.</b> <span class="muted">Plan it again; the new plan needs a new decision.</span></div>${cmd(`hone-select experiments plan ${x.eid}`)}</div>`;
  if (x.status === "running") return `<div class="card callout"><div style="flex:1;min-width:240px"><b>Running</b> <span class="muted">— ${fmt(x.done)} of ${fmt(x.outputs)} outputs. This page refreshes itself.</span><div style="margin-top:8px">${progress(x.done, x.outputs)}</div></div>${cmd(`hone-select experiments stop ${x.eid}`)}</div>`;
  const steps = {draft: ["Plan it to see what will run and what it costs.", `hone-select experiments plan ${x.eid}`],
    approved: [`Approved by ${x.review?.by ?? "?"}. Start it when you are ready.`, `hone-select experiments start ${x.eid}`],
    stopped: ["Stopped before the end. Starting again resumes where it stopped.", `hone-select experiments start ${x.eid}`],
    denied: [`Denied by ${x.review?.by ?? "?"}${x.review?.note ? `: ${x.review.note}` : ""}. Edit the definition, then plan it again.`, `hone-select experiments plan ${x.eid}`]}[x.status];
  return steps ? `<div class="card callout ${x.status === "denied" ? "bad" : ""}"><div class="muted">${esc(steps[0])}</div>${cmd(steps[1])}</div>` : "";
}
function factorChart(name, levels) {
  const entries = Object.entries(levels).filter(([, s]) => typeof s.total.mean === "number");
  if (!entries.length) return "";
  const max = Math.max(...entries.map(([, s]) => s.total.high ?? s.total.mean), 0.0001);
  const best = entries.reduce((a, b) => (b[1].total.mean > a[1].total.mean ? b : a))[0];
  const w = v => `${100 * v / max}%`;
  return `<div class="card"><div class="row"><b>${esc(name)}</b><span class="muted">best: <b style="color:var(--accent)">${esc(best)}</b></span></div><div class="chart">${entries.map(([lvl, s]) =>
    `<div class="lvl"><div class="name" title="${esc(lvl)}">${esc(lvl)}</div><div class="bar"><div class="fill ${lvl === best ? "win" : ""}" style="width:${w(s.total.mean)}"></div>${typeof s.total.low === "number" ? `<div class="ci" style="left:${w(s.total.low)};width:calc(${w(s.total.high)} - ${w(s.total.low)})"></div>` : ""}</div><div class="num">${fmt(s.total.mean)}</div></div>`).join("")}</div>
    <div class="muted" style="font-size:12px">Mean total with its 95% interval. Pass rate: ${entries.map(([l, s]) => `${esc(l)} ${pct(s.pass_rate)}`).join(", ")}</div></div>`;
}
function overview(x) {
  const r = x.results, used = x.samples.reduce((a, s) => a + (s.measurements.seconds || 0), 0);
  const costs = x.samples.map(s => s.cost_usd).filter(v => typeof v === "number");
  const errors = x.samples.filter(s => s.error).length;
  const tiles = `<div class="grid">${[tile("Progress", `${fmt(x.done)} / ${fmt(x.outputs ?? "?")}`, progress(x.done, x.outputs)),
    tile("Test cases", fmt(x.plan?.cases.length)), tile("Setups", fmt(x.plan ? Object.keys(x.plan.setups).length : null)),
    tile("Errors", fmt(errors), x.samples.length ? `${pct(errors / x.samples.length)} of samples` : ""),
    tile("Time used", duration(used)), tile("Cost", costs.length ? "$" + fmt(costs.reduce((a, b) => a + b, 0)) : "—", costs.length ? "" : "not reported")].join("")}</div>`;
  if (!r) return tiles + `<div class="card empty" style="margin-top:14px">${x.samples.length ? "Results appear when the run completes." : "No outputs yet."}</div>`;
  const best = r.best ? r.setups[r.best] : null;
  const answer = best ? `<div class="card answer"><div class="muted">The answer</div><div class="big">${chips(best.params)}</div>
    <div class="muted">Mean total <b style="color:var(--text)">${fmt(best.total.mean)}</b> (95% interval ${fmt(best.total.low)} to ${fmt(best.total.high)}) · wins ${best.wins} of ${x.plan.cases.length} cases · pass rate ${pct(best.pass_rate)}</div>
    ${Object.entries(r.baselines).map(([b, diffs]) => diffs[r.best] ? `<div class="muted" style="margin-top:4px">Against baseline <b>${esc(b)}</b>: ${signed(diffs[r.best].diff)} ${diffs[r.best].clear ? `<span class="pill ok">clearly better</span>` : `<span class="pill">not a clear difference</span>`}</div>` : `<div class="muted" style="margin-top:4px">The baseline <b>${esc(b)}</b> is the best setup.</div>`).join("")}</div>` : "";
  const charts = Object.entries(r.factors).map(([f, levels]) => factorChart(f, levels)).join("");
  const humans = Object.keys(x.human || {});
  return tiles + answer + (charts ? `<h2>Which value of each setting wins</h2><div class="cards">${charts}</div>` : "") +
    (humans.length ? `<h2>Your ratings</h2><div class="cards">${humans.map(h => `<div class="card row"><div><b>${esc(x.human[h].question)}</b><div class="muted">${esc(h)} · scale ${x.human[h].scale.join("–")}</div></div><a class="btn primary" href="#/rate/${esc(x.eid)}/${esc(h)}">Rate</a></div>`).join("")}</div>` : "");
}
function resultsTab(x, el) {
  const r = x.results;
  if (!r) { el.innerHTML = `<div class="card empty">No results yet.</div>`; return; }
  const factors = Object.keys(x.factors), crit = [...new Set(Object.values(r.setups).flatMap(s => Object.keys(s.criteria)))];
  const max = Math.max(...Object.values(r.setups).map(s => s.total.high ?? s.total.mean ?? 0), 0.0001);
  el.innerHTML = `<h2 style="margin-top:0">Setups, best first</h2><div id="rs"></div>${Object.keys(r.baselines).map(b => `<h2>Against baseline ${esc(b)}</h2><div id="rb-${esc(b)}"></div>`).join("")}
    ${Object.keys(r.agreement || {}).length ? `<h2>Judge agreement</h2><div class="card kv">${Object.entries(r.agreement).map(([k, v]) => `<span>${esc(k)}</span><span>mean difference ${fmt(v)}</span>`).join("")}</div>` : ""}`;
  table($("rs"), [
    ...factors.map(f => ({label: f, get: s => s.params[f]})),
    {label: "Total (95% interval)", num: true, get: s => s.total.mean, html: s => scorebar(s.total.mean, {low: s.total.low, high: s.total.high, win: s.id === r.best, max})},
    {key: "wins", label: "Wins", num: true}, {key: "pass_rate", label: "Pass rate", num: true, html: s => esc(pct(s.pass_rate))},
    {key: "errors", label: "Errors", num: true},
    ...crit.map(c => ({label: c, num: true, get: s => s.criteria[c], html: s => scorebar(s.criteria[c])})),
  ], r.ranking.map(id => ({id, ...r.setups[id]})), {rowClass: s => s.id === r.best ? "win" : ""});
  for (const [b, diffs] of Object.entries(r.baselines))
    table($(`rb-${b}`), [...factors.map(f => ({label: f, get: s => r.setups[s.id].params[f]})),
      {key: "diff", label: "Difference", num: true, html: s => esc(signed(s.diff))},
      {label: "95% interval", get: s => `${fmt(s.low)} to ${fmt(s.high)}`}, {label: "Clear", get: s => s.clear ? "yes" : "no", html: s => s.clear ? `<span class="pill ok">clear</span>` : `<span class="pill">not clear</span>`}],
      Object.entries(diffs).map(([id, v]) => ({id, ...v})));
}

function samplesTab(x, el) {
  const factors = Object.keys(x.factors);
  const scores = [...new Set(x.samples.flatMap(s => Object.keys(s.scores)))].filter(n => n !== "ran_ok");
  el.innerHTML = `<p class="muted" style="margin-top:0">Every output. Click one for its text, files (images, audio and video play here), scores, measurements and log.</p><div id="smp"></div>`;
  table($("smp"), [{key: "case", label: "Case"}, ...factors.map(f => ({label: f, get: s => s.params[f]})),
    {key: "total", label: "Total", num: true, html: s => scorebar(s.total, {win: s.winner})},
    ...scores.map(n => ({label: n, num: true, get: s => s.scores[n] ?? null, html: s => scorebar(s.scores[n] ?? null)})),
    {label: "Time (s)", title: "measured seconds", num: true, get: s => s.measurements.seconds ?? null},
    {label: "Status", get: s => s.error ? "error" : s.winner ? "winner" : "", html: s => s.error ? `<span class="pill bad" title="${esc(s.error)}">error</span>` : s.winner ? `<span class="pill accent">winner</span>` : ""}],
    x.samples, {onRow: s => sampleDrawer(x, s), rowClass: s => s.winner ? "win" : "", empty: "No outputs yet."});
}
function planTab(x, el) {
  const p = x.plan;
  if (!p) { el.innerHTML = `<div class="card callout"><div class="muted">No plan yet.</div>${cmd(`hone-select experiments plan ${x.eid}`)}</div>`; return; }
  const e = p.estimate;
  el.innerHTML = `<div class="grid">${[tile("Outputs", fmt(p.outputs), `${p.cases.length} cases × ${Object.keys(p.setups).length} setups × ${p.samples}`), tile("Judge calls", fmt(p.judge_calls)),
      tile("Estimated time", e.seconds === null ? "—" : duration(e.seconds)), tile("Estimated cost", e.money_usd === null ? "—" : "$" + fmt(e.money_usd)), tile("Subject", esc(p.subject))].join("")}</div>
    <p class="muted">Estimate: ${esc(e.from)}. Planned ${esc(when(p.planned_at))}.</p>
    <h2>What runs</h2>${p.commands.map(c => `<pre>${esc(c)}</pre>`).join("")}
    <h2>Setups</h2><div id="ps"></div><h2>Test cases</h2><div class="card">${p.cases.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>`;
  const factors = Object.keys(x.factors), bases = new Set(Object.values(p.baselines));
  table($("ps"), [{key: "id", label: "Setup", html: s => `<span class="mono">${esc(s.id)}</span>${bases.has(s.id) ? ` <span class="pill info">baseline</span>` : ""}`},
    ...factors.map(f => ({label: f, get: s => s[f]}))], Object.entries(p.setups).map(([id, s]) => ({id, ...s})));
}
async function showExperiment(eid, tab) {
  const x = await get(`/api/experiments/${eid}`);
  const tabs = [["overview", "Overview"], ["results", "Results"], ["samples", "Samples", x.samples.length], ["plan", "Plan"], ["definition", "Definition"], ["reviews", "Reviews", x.reviews.length]];
  tab = tabs.some(([k]) => k === tab) ? tab : "overview";
  main.innerHTML = head(esc(x.title), esc(x.question), `<a href="#/experiments">Experiments</a> / <span class="mono">${esc(x.eid)}</span>`, pill(x.status)) + nextStep(x) +
    `<div class="tabs" role="tablist">${tabs.map(([k, label, n]) => `<a role="tab" class="${k === tab ? "active" : ""}" href="#/experiment/${esc(x.eid)}/${k}">${label}${n ? `<span class="count">${n}</span>` : ""}</a>`).join("")}</div><div id="tab"></div>`;
  const el = $("tab");
  if (tab === "overview") el.innerHTML = overview(x);
  else if (tab === "results") resultsTab(x, el);
  else if (tab === "samples") samplesTab(x, el);
  else if (tab === "plan") planTab(x, el);
  else if (tab === "definition") el.innerHTML = `<p class="muted" style="margin-top:0">The definition as written (values of secret-named keys are hidden).</p><pre style="max-height:none">${esc(x.definition)}</pre>`;
  else el.innerHTML = x.reviews.length ? `<div class="card">${x.reviews.slice().reverse().map(r => `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--border)"><div>${pill(r.decision)} <b>${esc(r.by)}</b> <span class="muted">${esc(r.note || "")}</span></div><span class="muted">${esc(when(r.at))}</span></div>`).join("")}</div>` : `<div class="card empty">No decisions yet.</div>`;
  if (x.status === "proposed" && x.plan) {
    const decide = async decision => {
      try { await send(`/api/experiments/${x.eid}/review`, {decision, note: $("note").value}); toast(decision === "approve" ? "Approved" : "Denied"); route(); }
      catch (e) { toast(e.message); }
    };
    $("approve").onclick = () => decide("approve"); $("deny").onclick = () => decide("deny");
  }
  if (x.status === "running") refresh = setTimeout(route, 4000);
}
async function showRate(eid, criterion) {
  const o = await get(`/api/experiments/${eid}/rate/${criterion}`);
  const crumbs = `<a href="#/experiments">Experiments</a> / <a href="#/experiment/${esc(eid)}">${esc(eid)}</a> / rate`;
  if (!o) {
    main.innerHTML = head("Everything is rated", `Every output has a rating for ${esc(criterion)}. Recompute the results to include them.`, crumbs) +
      `<div class="card callout ok"><div class="muted">Include the ratings in the results:</div>${cmd(`hone-select experiments report ${eid}`)}</div>`;
    return;
  }
  const [low, high] = o.scale, done = o.total - o.remaining;
  main.innerHTML = `<div class="rate">${head(esc(o.question), "Which setup made it is hidden: rate what you see.", crumbs)}
    <div class="row muted" style="margin-bottom:6px"><span>${done + 1} of ${o.total}</span><span>case <b>${esc(o.case)}</b></span></div>${progress(done, o.total)}
    <div class="card" style="margin-top:14px">${o.data !== null && o.data !== undefined ? outputView(o.data) : ""}${o.files.map(n => fileView(eid, o.file_base, n)).join("")}</div>
    <div class="scale">${Array.from({length: high - low + 1}, (_, i) => low + i).map(v => `<button class="btn" data-v="${v}">${v}</button>`).join("")}</div>
    <div class="row muted" style="font-size:12.5px"><span>${low} = worst</span><span>or press <span class="kbd">${low}</span>–<span class="kbd">${high}</span></span><span>${high} = best</span></div></div>`;
  const rate = async v => {
    try { await send(`/api/experiments/${eid}/rate`, {sample_id: o.sample_id, criterion, value: v}); route(); }
    catch (e) { toast(e.message); }
  };
  main.querySelectorAll("button[data-v]").forEach(b => b.onclick = () => rate(Number(b.dataset.v)));
  document.onkeydown = e => { const v = Number(e.key); if (e.key.length === 1 && v >= low && v <= high) rate(v); };
}

// ---- routing ---------------------------------------------------------------------------------------
async function route() {
  clearTimeout(refresh); closeDrawer(); document.onkeydown = null;
  const hash = location.hash || "#/experiments";
  const section = hash.startsWith("#/run") ? "runs" : hash.startsWith("#/candidates") ? "candidates" : "experiments";
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("active", a.dataset.nav === section));
  try {
    if (hash.startsWith("#/runs")) await showRuns();
    else if (hash.startsWith("#/run/")) await showRun(decodeURIComponent(hash.slice(6)));
    else if (hash.startsWith("#/candidates")) await showCandidates();
    else if (hash.startsWith("#/experiment/")) { const [eid, tab] = hash.slice(13).split("/").map(decodeURIComponent); await showExperiment(eid, tab); }
    else if (hash.startsWith("#/rate/")) await showRate(...hash.slice(7).split("/").map(decodeURIComponent));
    else await showExperiments();
  } catch (e) {
    main.innerHTML = head("Something went wrong") + `<div class="card callout bad"><div>${esc(e.message)}</div><a class="btn" href="#/experiments">Back to experiments</a></div>`;
  }
  window.scrollTo(0, 0);
}
get("/api/info").then(i => {
  $("source").innerHTML = `<div><b>Store</b></div><div class="mono">${esc(i.store)}${i.store_exists ? "" : " (none yet)"}</div>` +
    (i.project ? `<div style="margin-top:6px"><b>Project</b></div><div class="mono">${esc(i.project)}</div>` : "");
}).catch(() => {});
window.onhashchange = route;
route();
</script>
