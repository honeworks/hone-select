[project]
name = "hone-select"
dynamic = ["version"]
description = "Generate, score and select the best of N candidates with pluggable code or prompt scorers."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Bahman Shadmehr", email = "info@bshadmehr.me" }]
keywords = [
    "ai", "llm", "generative-ai", "best-of-n", "llm-as-a-judge", "evaluation", "reranking", "selection",
    "honeworks",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
langchain = ["langchain-core>=0.3"]
models = ["hone-models>=0.1"]
cli = ["typer>=0.12"]

[dependency-groups]
dev = [
    "pytest>=8", "pytest-cov>=5", "pytest-timeout>=2.3", "hypothesis>=6.100",
    "respx>=0.21", "ruff>=0.6", "pyright>=1.1.380",
]

[project.urls]
Homepage = "https://github.com/honeworks/hone-select"
Repository = "https://github.com/honeworks/hone-select"
Issues = "https://github.com/honeworks/hone-select/issues"
Documentation = "https://github.com/honeworks/hone-select/tree/main/docs"
Changelog = "https://github.com/honeworks/hone-select/blob/main/CHANGELOG.md"

[project.scripts]
hone-select = "hone_select.cli:main"

[project.entry-points."hone.decision_clients"]
"hone_models:decision" = "hone_select.adapters.hone_models:decision"

[project.entry-points."hone.machine_probes"]
"hone_models:machine" = "hone_select.adapters.hone_models:machine"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/hone_select/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hone_select"]

[tool.hatch.build.targets.sdist]
include = [
    "src/", "tests/", "docs/", "examples/", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "CHANGELOG.md",
    "pyproject.toml",
]
exclude = ["design/", ".hone/"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "S", "C4", "DTZ", "PL", "C90"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/hone_select/testing/contracts.py" = ["S101"]   # checkers assert by design (design/current.md §7.9)
"examples/**" = ["S101", "S311", "S603", "PT017", "PT018"]  # plain asserts of key facts, seeded sampling, own commands
"tests/**" = ["S101", "S603", "PLR0915", "N802", "RUF043", "S311", "E501", "PLC0415"]

[tool.uv.sources]
# hone-models is not on PyPI yet: resolve it from GitHub for development (design/decisions.md D-001);
# remove once published. Built wheels carry only `hone-models>=0.1`.
hone-models = { git = "https://github.com/honeworks/hone-models", branch = "main" }

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not gpu and not ollama and not comfyui and not hosted'"
timeout = 120
markers = [
    "e2e: acceptance-case tests (run by default)",
    "gpu: needs the shared GPU; run via scripts/gpu-lock.sh",
    "ollama: needs a running Ollama",
    "comfyui: needs ComfyUI",
    "hosted: needs a hosted API key",
    "slow: slower than 5 s",
]

[tool.coverage.run]
branch = true
source = ["src/hone_select"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]
